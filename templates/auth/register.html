<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Retinex</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b5e3a 0%, #1a8a5a 50%, #0d7a4e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container { width: 100%; display: flex; justify-content: center; }

        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .auth-logo { text-align: center; margin-bottom: 32px; }
        .auth-logo h1 { font-size: 2rem; color: #0b5e3a; font-weight: 700; letter-spacing: 1px; }
        .auth-logo p { color: #666; font-size: 0.9rem; margin-top: 4px; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input,
        .form-group select {
            width: 100%; padding: 11px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px; font-size: 0.95rem;
            color: #333; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus { border-color: #0b5e3a; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .role-selector { display: flex; gap: 12px; margin-top: 6px; }
        .role-option {
            flex: 1; display: flex; align-items: center;
            justify-content: center; gap: 8px; padding: 10px;
            border: 1.5px solid #e0e0e0; border-radius: 8px;
            cursor: pointer; font-weight: 600; color: #555;
            transition: all 0.2s;
        }
        .role-option input[type="radio"] { width: auto; accent-color: #0b5e3a; }
        .role-option:has(input:checked) {
            border-color: #0b5e3a;
            background: #f0f8f5;
            color: #0b5e3a;
        }

        .btn-primary {
            width: 100%; padding: 12px;
            background: #0b5e3a; color: white;
            border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600;
            cursor: pointer; margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #094d30; }

        .auth-footer { text-align: center; margin-top: 24px; font-size: 0.9rem; color: #666; }
        .auth-footer a { color: #0b5e3a; font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }

        .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; font-weight: 500; }
        .alert-success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #2e7d32; }
        .alert-danger  { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }
        .alert-warning { background: #fff8e1; color: #f57f17; border-left: 4px solid #f57f17; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>Retinex</h1>
                <p>Create your account</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="form-group">
                    <label>I am a</label>
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="patient" checked onchange="toggleFields()">
                            <span>Patient</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="doctor" onchange="toggleFields()">
                            <span>Doctor</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>

                <!-- Patient Fields -->
                <div id="patient-fields">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" placeholder="Your age">
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender">
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" name="phone" placeholder="Your phone number">
                    </div>
                </div>

                <!-- Doctor Fields -->
                <div id="doctor-fields" style="display:none;">
                    <div class="form-group">
                        <label for="specialization">Specialization</label>
                        <input type="text" id="specialization" name="specialization" placeholder="e.g. Ophthalmology">
                    </div>
                    <div class="form-group">
                        <label for="license_number">License Number</label>
                        <input type="text" id="license_number" name="license_number" placeholder="Medical license number">
                    </div>
                </div>

                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        function toggleFields() {
            const role = document.querySelector('input[name="role"]:checked').value;
            document.getElementById('patient-fields').style.display = role === 'patient' ? 'block' : 'none';
            document.getElementById('doctor-fields').style.display  = role === 'doctor'  ? 'block' : 'none';
        }
    </script>
</body>
</html>
